name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "1.24", "1.25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Vet
        run: go vet ./...
      - name: Test (pure Go, CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go test -v ./...
      - name: Test (race detector)
        run: go test -race ./...
      - name: Build (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/tracelight
      - name: Run demo
        run: ./tracelight demo
