<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tracelight — Packet Capture Inspector</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-panel: #151b23;
    --bg-elev: #1c2430;
    --bg-hover: #212b3a;
    --bg-selected: #1e3148;
    --border: #2a3444;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --tls: #c084fc;
    --http: #3fb950;
    --dns: #39c5cf;
    --tcp: #58a6ff;
    --udp: #d29922;
    --icmp: #f85149;
    --err: #f85149;
    --warn: #f0883e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.45;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    font-family: var(--mono);
  }
  .brand .tag {
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: var(--mono);
  }
  .stats {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  .stats strong { color: var(--text); font-weight: 600; }
  .upload-btn {
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--mono);
  }
  .upload-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-bar {
    padding: 10px 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .filter-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .filter-input {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: var(--mono);
    font-size: 12.5px;
    outline: none;
  }
  .filter-input:focus { border-color: var(--accent); }
  .filter-input.invalid { border-color: var(--err); }
  .btn {
    background: var(--accent);
    color: #08111c;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-ghost {
    background: var(--bg-elev);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .chip-label { font-size: 11px; color: var(--text-dim); margin-right: 2px; }
  .chip {
    background: var(--bg-elev);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .filter-error {
    color: var(--err);
    font-family: var(--mono);
    font-size: 12px;
    display: none;
  }
  main {
    display: grid;
    grid-template-rows: minmax(200px, 38vh) 1fr;
    height: calc(100vh - 122px);
    min-height: 520px;
  }
  .panel {
    overflow: auto;
    border-bottom: 1px solid var(--border);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--bg-elev);
    color: var(--text-dim);
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    user-select: none;
    cursor: pointer;
    white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  thead th.num, tbody td.num { text-align: right; }
  tbody tr {
    border-bottom: 1px solid #1d2430;
    cursor: pointer;
  }
  tbody tr:hover { background: var(--bg-hover); }
  tbody tr.selected { background: var(--bg-selected); }
  tbody td {
    padding: 6px 10px;
    white-space: nowrap;
    max-width: 340px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .p-tls { background: rgba(192, 132, 252, 0.16); color: var(--tls); }
  .p-http { background: rgba(63, 185, 80, 0.16); color: var(--http); }
  .p-dns { background: rgba(57, 197, 207, 0.16); color: var(--dns); }
  .p-tcp { background: rgba(88, 166, 255, 0.16); color: var(--tcp); }
  .p-udp { background: rgba(210, 153, 34, 0.16); color: var(--udp); }
  .p-icmp { background: rgba(248, 81, 73, 0.16); color: var(--icmp); }
  .p-other { background: rgba(139, 148, 158, 0.16); color: var(--text-dim); }
  .retrans-tag {
    color: var(--err);
    font-weight: 700;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    overflow: hidden;
    min-height: 0;
  }
  @media (max-width: 980px) {
    main { height: auto; grid-template-rows: 260px auto; }
    .detail-grid { grid-template-columns: 1fr; }
  }
  .subpanel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }
  .subpanel:last-child { border-right: none; }
  .subhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 12px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    gap: 8px;
  }
  .subhead .meta {
    font-family: var(--mono);
    font-weight: 400;
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11.5px;
    cursor: pointer;
  }
  .tab.active {
    background: var(--bg-elev);
    color: var(--text);
    border-color: var(--border);
  }
  .scroll-area {
    flex: 1;
    overflow: auto;
    padding: 8px 12px;
  }

  /* Waterfall timeline */
  .wf-list { display: flex; flex-direction: column; gap: 4px; }
  .wf-row {
    display: grid;
    grid-template-columns: 44px 78px 26px 1fr;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 5px;
    border: 1px solid transparent;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .wf-row:hover { background: var(--bg-hover); }
  .wf-row.selected { background: var(--bg-selected); border-color: #2f5480; }
  .wf-row.retrans { border-left: 3px solid var(--err); }
  .wf-idx { color: var(--text-dim); }
  .wf-time { color: var(--text-dim); text-align: right; }
  .wf-arrow { font-weight: 700; text-align: center; }
  .wf-arrow.fwd { color: var(--tcp); }
  .wf-arrow.rev { color: var(--http); }
  .wf-track {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .wf-bar-bg {
    position: relative;
    height: 6px;
    background: #1b222d;
    border-radius: 3px;
    overflow: hidden;
  }
  .wf-bar-dot {
    position: absolute;
    top: 0;
    height: 100%;
    min-width: 6px;
    border-radius: 3px;
  }
  .wf-summary {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .wf-retrans-badge {
    color: var(--err);
    font-weight: 700;
    margin-right: 4px;
  }

  /* Inspector + Hex */
  .layers {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .layer-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
  }
  .layer-title {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .layer-summary {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 11px;
    margin-left: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 3px 12px;
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .kv-k { color: var(--text-dim); }
  .kv-v { color: var(--text); word-break: break-all; }
  .hex-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .hex-pre {
    margin: 0;
    padding: 10px;
    background: #0a0d12;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.5;
    overflow-x: auto;
    color: #c9d1d9;
  }
  .hex-off { color: var(--text-dim); }
  .hex-ascii { color: #7ee787; }
  .empty {
    color: var(--text-dim);
    font-family: var(--mono);
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>tracelight</h1>
      <span class="tag" id="fmtTag">-</span>
    </div>
    <div class="stats" id="statsBar">Loading capture...</div>
    <label class="upload-btn">
      Open .pcap / .pcapng
      <input type="file" id="fileInput" accept=".pcap,.pcapng,.cap" hidden>
    </label>
  </header>

  <section class="filter-bar">
    <div class="filter-row">
      <input id="filterInput" class="filter-input" type="text" placeholder="Filter flows: proto==tls && host contains example.com  (supports ip==, port==, proto==, host contains, &&, ||, !, ())">
      <button id="applyFilterBtn" class="btn">Apply</button>
      <button id="clearFilterBtn" class="btn-ghost">Clear</button>
    </div>
    <div id="filterError" class="filter-error"></div>
    <div class="chips">
      <span class="chip-label">Examples:</span>
      <button class="chip" data-f="proto==tls">proto==tls</button>
      <button class="chip" data-f="proto==http">proto==http</button>
      <button class="chip" data-f="proto==dns">proto==dns</button>
      <button class="chip" data-f="port==443 || port==8080">port==443 || port==8080</button>
      <button class="chip" data-f="host contains example.com && !proto==dns">host contains example.com &amp;&amp; !proto==dns</button>
      <button class="chip" data-f="retransmit==true">retransmit==true</button>
    </div>
  </section>

  <main>
    <div class="panel">
      <table id="flowsTable">
        <thead>
          <tr>
            <th data-sort="id">ID</th>
            <th data-sort="proto">PROTO</th>
            <th>SOURCE</th>
            <th>DESTINATION</th>
            <th>HOST / INFO</th>
            <th class="num" data-sort="packets">PKTS</th>
            <th class="num" data-sort="bytes">BYTES</th>
            <th class="num" data-sort="duration">DURATION</th>
            <th class="num" data-sort="rtt">RTT</th>
            <th class="num">RETR</th>
          </tr>
        </thead>
        <tbody id="flowsBody"></tbody>
      </table>
    </div>

    <div class="detail-grid">
      <div class="subpanel">
        <div class="subhead">
          <div>
            <span id="flowTitle">Select a flow</span>
            <span class="meta" id="flowMeta"></span>
          </div>
          <div class="tabs">
            <button class="tab active" id="tabWaterfall">Waterfall</button>
            <button class="tab" id="tabPacketList">Packet List</button>
          </div>
        </div>
        <div class="scroll-area" id="flowTimelinePane">
          <div class="empty">Select a flow above to inspect its waterfall timeline and packets.</div>
        </div>
      </div>

      <div class="subpanel">
        <div class="subhead">
          <div>
            <span>Packet Inspector</span>
            <span class="meta" id="pktMeta"></span>
          </div>
          <div class="tabs">
            <button class="tab active" id="hexModeRaw">Frame Bytes</button>
            <button class="tab" id="hexModeApp">App Payload</button>
          </div>
        </div>
        <div class="scroll-area" id="packetPane">
          <div class="empty">Select a packet from the waterfall or packet list.</div>
        </div>
      </div>
    </div>
  </main>

<script>
const state = {
  flows: [],
  selectedFlowId: null,
  selectedFlowDetail: null,
  selectedPacketIndex: null,
  leftView: "waterfall", // "waterfall" | "list"
  hexMode: "raw",        // "raw" | "app"
  sort: "start",
  order: "asc",
  filter: ""
};

function fmtDuration(ns) {
  if (!ns || ns <= 0) return "0ms";
  if (ns < 1e6) return (ns / 1e3).toFixed(0) + "us";
  if (ns < 1e9) return (ns / 1e6).toFixed(2) + "ms";
  return (ns / 1e9).toFixed(2) + "s";
}

function fmtBytes(b) {
  if (b < 1024) return b + " B";
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
  return (b / (1024 * 1024)).toFixed(1) + " MB";
}

function protoClass(p) {
  switch ((p || "").toLowerCase()) {
    case "tls": return "p-tls";
    case "http": return "p-http";
    case "dns": return "p-dns";
    case "tcp": return "p-tcp";
    case "udp": return "p-udp";
    case "icmp": return "p-icmp";
    default: return "p-other";
  }
}

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function decodeBase64(b64) {
  if (!b64) return new Uint8Array(0);
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function renderHexHTML(bytes) {
  if (!bytes || bytes.length === 0) {
    return '<div class="empty">No bytes in selected view.</div>';
  }
  const lines = [];
  for (let off = 0; off < bytes.length; off += 16) {
    const end = Math.min(off + 16, bytes.length);
    const hexParts = [];
    let ascii = "";
    for (let i = 0; i < 16; i++) {
      if (i === 8) hexParts.push(" ");
      if (off + i < end) {
        const v = bytes[off + i];
        hexParts.push(v.toString(16).padStart(2, "0") + " ");
        ascii += (v >= 0x20 && v <= 0x7e) ? esc(String.fromCharCode(v)) : ".";
      } else {
        hexParts.push("   ");
      }
    }
    const offStr = off.toString(16).padStart(4, "0");
    lines.push(`<span class="hex-off">${offStr}</span>  ${hexParts.join("")} <span class="hex-ascii">|${ascii}|</span>`);
  }
  return `<pre class="hex-pre">${lines.join("\n")}</pre>`;
}

async function loadSummary() {
  const res = await fetch("/api/summary");
  const s = await res.json();
  document.getElementById("fmtTag").textContent = `${s.source} · ${s.format || "capture"}`;
  document.getElementById("statsBar").innerHTML =
    `<span>Flows: <strong>${s.total_flows}</strong></span>` +
    `<span>Packets: <strong>${s.total_packets}</strong></span>` +
    `<span>Bytes: <strong>${fmtBytes(s.total_bytes)}</strong></span>` +
    `<span>Span: <strong>${fmtDuration(s.duration_ns)}</strong></span>`;
}

async function loadFlows() {
  const errEl = document.getElementById("filterError");
  const inputEl = document.getElementById("filterInput");
  const params = new URLSearchParams({
    filter: state.filter,
    sort: state.sort,
    order: state.order
  });
  const res = await fetch("/api/flows?" + params.toString());
  const data = await res.json();
  if (!res.ok) {
    errEl.textContent = data.error || "Invalid filter";
    errEl.style.display = "block";
    inputEl.classList.add("invalid");
    return;
  }
  errEl.style.display = "none";
  inputEl.classList.remove("invalid");
  state.flows = data.flows || [];
  renderFlows();

  if (state.flows.length > 0) {
    const keep = state.flows.find(f => f.id === state.selectedFlowId);
    await selectFlow(keep ? keep.id : state.flows[0].id);
  } else {
    state.selectedFlowId = null;
    state.selectedFlowDetail = null;
    renderFlowDetail();
  }
}

function renderFlows() {
  const body = document.getElementById("flowsBody");
  if (state.flows.length === 0) {
    body.innerHTML = '<tr><td colspan="10" class="empty">No flows match the active filter.</td></tr>';
    return;
  }
  body.innerHTML = state.flows.map(f => {
    const sel = f.id === state.selectedFlowId ? "selected" : "";
    const rtt = f.rtt_ns != null ? fmtDuration(f.rtt_ns) : "-";
    const retr = f.retransmissions > 0 ? `<span class="retrans-tag">${f.retransmissions}</span>` : "0";
    const info = f.host && !f.info.includes(f.host) ? `${f.host} · ${f.info}` : (f.info || "-");
    return `<tr class="${sel}" data-id="${f.id}">
      <td>${f.id}</td>
      <td><span class="badge ${protoClass(f.protocol)}">${esc(f.protocol)}</span></td>
      <td>${esc(f.source)}</td>
      <td>${esc(f.destination)}</td>
      <td title="${esc(info)}">${esc(info)}</td>
      <td class="num">${f.packet_count}</td>
      <td class="num">${fmtBytes(f.byte_count)}</td>
      <td class="num">${fmtDuration(f.duration_ns)}</td>
      <td class="num">${rtt}</td>
      <td class="num">${retr}</td>
    </tr>`;
  }).join("");

  body.querySelectorAll("tr[data-id]").forEach(tr => {
    tr.addEventListener("click", () => selectFlow(Number(tr.dataset.id)));
  });

  document.querySelectorAll("#flowsTable thead th[data-sort]").forEach(th => {
    const key = th.dataset.sort;
    const base = th.textContent.replace(/[ ▲▼]+$/, "");
    th.textContent = state.sort === key ? `${base} ${state.order === "asc" ? "▲" : "▼"}` : base;
  });
}

async function selectFlow(id) {
  state.selectedFlowId = id;
  renderFlows();
  const res = await fetch("/api/flows/" + id);
  if (!res.ok) return;
  state.selectedFlowDetail = await res.json();
  const pkts = state.selectedFlowDetail.packets || [];
  if (pkts.length > 0) {
    state.selectedPacketIndex = pkts[0].index;
  } else {
    state.selectedPacketIndex = null;
  }
  renderFlowDetail();
}

function renderFlowDetail() {
  const titleEl = document.getElementById("flowTitle");
  const metaEl = document.getElementById("flowMeta");
  const pane = document.getElementById("flowTimelinePane");

  if (!state.selectedFlowDetail) {
    titleEl.textContent = "Select a flow";
    metaEl.textContent = "";
    pane.innerHTML = '<div class="empty">Select a flow above to inspect its waterfall timeline and packets.</div>';
    renderPacketPane();
    return;
  }

  const fl = state.selectedFlowDetail.flow;
  const pkts = state.selectedFlowDetail.packets || [];
  titleEl.textContent = `Flow #${fl.id} · ${fl.protocol.toUpperCase()}`;
  metaEl.textContent = `${fl.source} ↔ ${fl.destination}` +
    (fl.host ? ` · ${fl.host}` : "") +
    (fl.rtt_ns != null ? ` · RTT ${fmtDuration(fl.rtt_ns)}` : "");

  if (pkts.length === 0) {
    pane.innerHTML = '<div class="empty">No packets in flow.</div>';
    renderPacketPane();
    return;
  }

  if (state.leftView === "waterfall") {
    const maxRel = Math.max(1, fl.duration_ns || pkts[pkts.length - 1].rel_flow_ns || 1);
    pane.innerHTML = `<div class="wf-list">` + pkts.map(p => {
      const pct = Math.min(96, Math.max(0, (p.rel_flow_ns / maxRel) * 94));
      const sel = p.index === state.selectedPacketIndex ? "selected" : "";
      const retr = p.is_retransmit ? "retrans" : "";
      const arrowCls = p.direction === "rev" ? "rev" : "fwd";
      const barColor = p.is_retransmit ? "var(--err)" : (p.direction === "rev" ? "var(--http)" : "var(--tcp)");
      const badge = p.is_retransmit ? '<span class="wf-retrans-badge">[RETRANS]</span>' : "";
      const summaryText = p.summary.replace(/^\[TCP Retransmission\]\s*/, "");
      return `<div class="wf-row ${sel} ${retr}" data-pkt="${p.index}">
        <span class="wf-idx">#${p.index}</span>
        <span class="wf-time">+${fmtDuration(p.rel_flow_ns)}</span>
        <span class="wf-arrow ${arrowCls}">${p.arrow}</span>
        <div class="wf-track">
          <div class="wf-bar-bg">
            <div class="wf-bar-dot" style="left:${pct.toFixed(1)}%; width:${Math.max(2, Math.min(18, p.length / 25)).toFixed(1)}%; background:${barColor};"></div>
          </div>
          <div class="wf-summary" title="${esc(p.summary)}">${badge}${esc(summaryText)}</div>
        </div>
      </div>`;
    }).join("") + `</div>`;
  } else {
    pane.innerHTML = `<table>
      <thead><tr><th>#</th><th>REL TIME</th><th>DIR</th><th>PROTO</th><th class="num">LEN</th><th>SUMMARY</th></tr></thead>
      <tbody>` + pkts.map(p => {
        const sel = p.index === state.selectedPacketIndex ? "selected" : "";
        return `<tr class="${sel}" data-pkt="${p.index}">
          <td>#${p.index}</td>
          <td>+${fmtDuration(p.rel_flow_ns)}</td>
          <td>${p.arrow}</td>
          <td><span class="badge ${protoClass(p.protocol)}">${esc(p.protocol)}</span></td>
          <td class="num">${p.length} B</td>
          <td title="${esc(p.summary)}">${esc(p.summary)}</td>
        </tr>`;
      }).join("") + `</tbody></table>`;
  }

  pane.querySelectorAll("[data-pkt]").forEach(el => {
    el.addEventListener("click", () => {
      state.selectedPacketIndex = Number(el.dataset.pkt);
      renderFlowDetail();
    });
  });

  renderPacketPane();
}

function renderPacketPane() {
  const metaEl = document.getElementById("pktMeta");
  const pane = document.getElementById("packetPane");
  if (!state.selectedFlowDetail || state.selectedPacketIndex == null) {
    metaEl.textContent = "";
    pane.innerHTML = '<div class="empty">Select a packet to inspect layers and payload bytes.</div>';
    return;
  }
  const pkt = (state.selectedFlowDetail.packets || []).find(p => p.index === state.selectedPacketIndex);
  if (!pkt) return;

  metaEl.textContent = `#${pkt.index} · +${fmtDuration(pkt.rel_flow_ns)} · ${pkt.length} bytes`;

  const layersHTML = (pkt.layers || []).map(l => {
    const fields = (l.fields || []).map(f =>
      `<div><span class="kv-k">${esc(f.name)}:</span> <span class="kv-v">${esc(f.value)}</span></div>`
    ).join("");
    return `<div class="layer-card">
      <div class="layer-title"><span>${esc(l.title)}</span><span class="layer-summary">${esc(l.summary)}</span></div>
      ${fields ? `<div class="kv-grid">${fields}</div>` : ""}
    </div>`;
  }).join("");

  const bytes = state.hexMode === "app" ? decodeBase64(pkt.app_bytes) : decodeBase64(pkt.raw_bytes);
  pane.innerHTML = `
    <div class="layers">${layersHTML}</div>
    <div class="hex-controls">
      <span style="font-weight:600;font-size:12px;">${state.hexMode === "app" ? "Application Payload" : "Raw Frame"} (${bytes.length} B)</span>
    </div>
    ${renderHexHTML(bytes)}
  `;
}

// Event wiring
document.getElementById("applyFilterBtn").addEventListener("click", () => {
  state.filter = document.getElementById("filterInput").value;
  loadFlows();
});
document.getElementById("filterInput").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    state.filter = e.target.value;
    loadFlows();
  }
});
document.getElementById("clearFilterBtn").addEventListener("click", () => {
  document.getElementById("filterInput").value = "";
  state.filter = "";
  loadFlows();
});
document.querySelectorAll(".chip[data-f]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.getElementById("filterInput").value = btn.dataset.f;
    state.filter = btn.dataset.f;
    loadFlows();
  });
});
document.querySelectorAll("#flowsTable thead th[data-sort]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.sort;
    if (state.sort === key) {
      state.order = state.order === "asc" ? "desc" : "asc";
    } else {
      state.sort = key;
      state.order = (key === "bytes" || key === "packets" || key === "duration") ? "desc" : "asc";
    }
    loadFlows();
  });
});
document.getElementById("tabWaterfall").addEventListener("click", () => {
  state.leftView = "waterfall";
  document.getElementById("tabWaterfall").classList.add("active");
  document.getElementById("tabPacketList").classList.remove("active");
  renderFlowDetail();
});
document.getElementById("tabPacketList").addEventListener("click", () => {
  state.leftView = "list";
  document.getElementById("tabPacketList").classList.add("active");
  document.getElementById("tabWaterfall").classList.remove("active");
  renderFlowDetail();
});
document.getElementById("hexModeRaw").addEventListener("click", () => {
  state.hexMode = "raw";
  document.getElementById("hexModeRaw").classList.add("active");
  document.getElementById("hexModeApp").classList.remove("active");
  renderPacketPane();
});
document.getElementById("hexModeApp").addEventListener("click", () => {
  state.hexMode = "app";
  document.getElementById("hexModeApp").classList.add("active");
  document.getElementById("hexModeRaw").classList.remove("active");
  renderPacketPane();
});
document.getElementById("fileInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  const buf = await file.arrayBuffer();
  const res = await fetch("/api/upload", {
    method: "POST",
    headers: { "X-File-Name": file.name },
    body: buf
  });
  const data = await res.json();
  if (!res.ok) {
    alert("Failed to load capture: " + (data.error || res.statusText));
    return;
  }
  state.selectedFlowId = null;
  await loadSummary();
  await loadFlows();
});

loadSummary().then(loadFlows);
</script>
</body>
</html>
